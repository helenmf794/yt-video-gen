name: Generate video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Video topic (English)"
        required: true
        type: string
      style:
        description: "Visual style"
        required: true
        default: "documentary"
        type: choice
        options:
          - documentary
          - stickman
          - whiteboard
          - cartoon-kids
          - anime
          - pixel-art
          - 3d-cartoon
      minutes:
        description: "Length in minutes"
        required: true
        default: "10"
        type: string
      text:
        description: "On-screen text: auto, off, keywords, cards, both"
        required: true
        default: "auto"
        type: choice
        options: [auto, off, keywords, cards, both]
      images:
        description: "Images: auto (per style), mix, ai, photos"
        required: true
        default: "auto"
        type: choice
        options: [auto, mix, ai, photos]
      voice:
        description: "TTS voice (auto = style default)"
        required: true
        default: "auto"
        type: string
      clips:
        description: "Experimental: number of old film clips from archive.org (0 = none)"
        required: true
        default: "0"
        type: string

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq fonts-dejavu-core
          pip install -r requirements.txt

      - name: Generate video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TOPIC: ${{ inputs.topic }}
          STYLE: ${{ inputs.style }}
          MINUTES: ${{ inputs.minutes }}
          TEXTMODE: ${{ inputs.text }}
          IMAGES: ${{ inputs.images }}
          VOICE: ${{ inputs.voice }}
          CLIPS: ${{ inputs.clips }}
        run: |
          python generate_video.py "$TOPIC" --style "$STYLE" --minutes "$MINUTES" \
            --text "$TEXTMODE" --images "$IMAGES" --voice "$VOICE" --clips "$CLIPS"

      - name: Publish as release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DIR=$(find output -mindepth 1 -maxdepth 1 -type d | head -n 1)
          TITLE=$(jq -r .title "$DIR/metadata.json")
          gh release create "video-${{ github.run_id }}" \
            "$DIR/video.mp4" "$DIR/metadata.json" "$DIR/subs.srt" \
            --title "$TITLE" \
            --notes "Topic: ${{ inputs.topic }} | Style: ${{ inputs.style }}"
